<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Grammar Game 🎮</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#8bc8fe;;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    .question {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .options button {
      padding: 10px;
      font-size: 1.5rem;
      border: none;
      background: #cce5ff;
      border-radius:10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .options button:hover {
      background: #1088ff;
    }
    .image {
      height: 150px;
      object-fit: contain;
      margin: 10px auto;
      display: block;
    }
    .score {
      text-align: center;
      font-size: 1.3rem;
      margin-top: 20px;
    }
    .restart-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .progress-container {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      height: 20px;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background-color: #4caf50;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="container">
     <h1 style="text-align:center;">🎯 English Game 🎯</h1>
    <h4 style="text-align:center;">Summary of the topics previously seen</h4>
      <h6 style="text-align:center;">Diana Laura Mutul Quintal</h6>

    
    <!-- Barra de progreso -->
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>

    <!-- Juego -->
    <div id="game"></div>
  </div>

  <script>
    const questions = [
      { q: "She ___ a doctor.", a: ["is", "are", "am"], correct: "is", img: "img1.jpg" },
      { q: "We ___ friends.", a: ["are", "am", "is"], correct: "are", img: "img2.jpg" },
      { q: "I ___ from Mexico.", a: ["am", "is", "are"], correct: "am", img: "img3.jpg" },
      { q: "___ do you live?", a: ["Where", "Why", "What"], correct: "Where", img: "img4.jpg" },
      { q: "___ is your name?", a: ["Where", "What", "Who"], correct: "What", img: "img5.jpg" },
      { q: "___ are you late?", a: ["Why", "When", "How"], correct: "Why", img: "img6.jpg" },
      { q: "___ you like pizza?", a: ["Do", "Does", "Did"], correct: "Do", img: "img7.jpg" },
      { q: "___ she play guitar?", a: ["Do", "Does", "Is"], correct: "Does", img: "img8.jpg" },
      { q: "___ they work here?", a: ["Do", "Does", "Are"], correct: "Do", img: "img9.jpg" },
      { q: "She ___ every day.", a: ["runs", "run", "ran"], correct: "runs", img: "img10.jpg" },
      { q: "We ___ to school.", a: ["go", "goes", "went"], correct: "go", img: "img11.jpg" },
      { q: "He ___ football.", a: ["plays", "play", "played"], correct: "plays", img: "img12.jpg" },
      { q: "I work ___ Monday.", a: ["on", "in", "at"], correct: "on", img: "img13.jpg" },
      { q: "We meet ___ 3 PM.", a: ["at", "on", "in"], correct: "at", img: "img14.jpg" },
      { q: "She was born ___ April.", a: ["in", "on", "at"], correct: "in", img: "img15.jpg" },
      { q: "___ a cat on the roof.", a: ["There is", "There are", "Is there"], correct: "There is", img: "img16.jpg" },
      { q: "___ two apples.", a: ["There is", "There are", "There be"], correct: "There are", img: "img17.jpg" },
      { q: "___ a book on the table?", a: ["Is there", "Are there", "There is"], correct: "Is there", img: "img18.png" },
      { q: "He runs ___ .", a: ["quickly", "quick", "quicker"], correct: "quickly", img: "img19.jpg" },
      { q: "She sings ___ .", a: ["beautifully", "beautiful", "beauty"], correct: "beautifully", img: "img20.png" },
      { q: "They arrived ___ .", a: ["late", "lately", "later"], correct: "late", img: "img21.jpg" }
    ];

    let current = 0;
    let score = 0;

    function updateProgressBar() {
      const progress = (current / questions.length) * 100;
      document.getElementById("progress-bar").style.width = progress + "%";
    }

    function renderQuestion() {
      const game = document.getElementById("game");

      if (current >= questions.length) {
        game.innerHTML = `<div class='score'>You scored ${score} out of ${questions.length}</div>
          <button class='restart-btn' onclick='restartGame()'>Play Again</button>`;
        document.getElementById("progress-bar").style.width = "100%";
        return;
      }

      const q = questions[current];
      let html = `<center><div class='question'>${current + 1}: ${q.q}</div></center>`;
      html += `<img src='${q.img}' alt='Image' class='image' />`;
      html += `<div class='options'>`;
      q.a.forEach(opt => {
        html += `<button onclick='selectAnswer("${opt}")'>${opt}</button>`;
      });
      html += `</div>`;
      game.innerHTML = html;

      updateProgressBar();
    }

    function selectAnswer(answer) {
      if (answer === questions[current].correct) {
        score++;
      }
      current++;
      renderQuestion();
    }

    function restartGame() {
      current = 0;
      score = 0;
      renderQuestion();
    }

    window.onload = renderQuestion;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<body>

        <button class="answer-btn" onclick="askDevice('printer')"> Impresora <img src="impresora.ico" alt="imagen" width="35"></button>
        <button class="answer-btn" onclick="askDevice('equipo')"> Computadora <img src="computadora.ico" alt="imagen" width="35"></button>
    </div>

    <div id="diagnosis"></div>

    <script src="script.js"></script>
